name: PHP test
description: Install, validate and test PHP application.

inputs:
  version:
    description: PHP version.
    required: true
    
  app-directory:
    description: Application directory.
    required: true
    default: "."

runs:
  using: composite
  steps:
    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.version }}
        tools: composer, phpunit

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.app_directory }}
      run: |
        set -euo pipefail

        if [ ! -f composer.json ]; then
          echo "composer.json not found"
          exit 1
        fi

        composer install --no-interaction --prefer-dist

    - name: PHP syntax validation
      shell: bash
      working-directory: ${{ inputs.app_directory }}
      run: |
        set -euo pipefail

        find . -type f -name "*.php" \
          -not -path "./vendor/*" \
          -print0 | xargs -0 -r -n1 php -l

    - name: Run PHP tests
      shell: bash
      working-directory: ${{ inputs.app_directory }}
      run: |
        set -euo pipefail

        if composer run-script --list 2>/dev/null | grep -qE '^[[:space:]]+test([[:space:]]|$)'; then
          composer test

        elif [ -f phpunit.xml ] || [ -f phpunit.xml.dist ]; then
          if [ -x vendor/bin/phpunit ]; then
            vendor/bin/phpunit
          else
            echo "PHPUnit is not installed"
            exit 1
          fi

        else
          echo "PHP test script or PHPUnit configuration not found"
          exit 1
        fi