
name: PHP Test
description: Run PHP application tests using PHPUnit

inputs:
  php_version:
    description: PHP runtime version
    required: true

  app_directory:
    description: Application directory
    required: false
    default: "."

runs:
  using: composite

  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php_version }}
        coverage: none

    - name: Install Composer Dependencies
      if: hashFiles(format('{0}/composer.json', inputs.app_directory)) != ''
      shell: bash
      working-directory: ${{ inputs.app_directory }}
      run: |
        composer install --no-interaction --prefer-dist

    - name: Run PHP Tests
      shell: bash
      working-directory: ${{ inputs.app_directory }}
      run: |
        if [ -f vendor/bin/phpunit ]; then
          vendor/bin/phpunit

        elif composer run-script --list 2>/dev/null | grep -q 'test'; then
          composer test

        else
          echo "No PHPUnit installation or Composer test script found."
          exit 1
        fi
