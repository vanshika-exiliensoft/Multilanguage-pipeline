
name: Node.js Test
description: Run Node.js application tests

inputs:
  node_version:
    required: true
  app_directory:
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node_version }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.app_directory }}
      run: npm ci

    - name: Run tests
      shell: bash
      working-directory: ${{ inputs.app_directory }}
      run: npm test
