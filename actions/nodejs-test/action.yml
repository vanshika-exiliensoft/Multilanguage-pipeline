name: Nodejs test
description: Install, build and test Node.js application

inputs:
  version:
    description: Node.js version.
    required: true

  app-directory:
    description: Application directory.
    required: true
    default: "."

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.version }}
        cache: npm
        cache-dependency-path: ${{ inputs.app-directory }}/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.app-directory }}
      run: |
        set -euo pipefail

        if [ ! -f package.json ]; then
          echo "package.json not found"
          exit 1
        fi

        if [ -f package-lock.json ]; then
          npm ci
        else
          npm install
        fi

    - name: Build application
      shell: bash
      working-directory: ${{ inputs.app-directory }}
      run: |
        set -euo pipefail

        if npm run | grep -qE '^[[:space:]]+build$'; then
          npm run build
        else
          echo "No build script found. Skipping build."
        fi

    - name: Run Nodejs test
      shell: bash
      working-directory: ${{ inputs.app-directory }}
      run: |
        set -euo pipefail

        if ! npm run | grep -qE '^[[:space:]]+test$'; then
          echo "Test script not found in package.json"
          exit 1
        fi

        npm test