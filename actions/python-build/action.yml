
name: Python Build
description: Install dependencies and build Python application

inputs:
  python_version:
    required: true
  app_directory:
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.app_directory }}
      run: |
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi

    - name: Build application
      shell: bash
      working-directory: ${{ inputs.app_directory }}
      run: |
        if [ -f pyproject.toml ]; then
          pip install build
          python -m build
        else
          echo "No pyproject.toml found. Skipping package build."
        fi
