
name: Java Test
description: Run Java application tests using Maven or Gradle

inputs:
  java_version:
    description: Java runtime version
    required: true

  app_directory:
    description: Application directory
    required: false
    default: "."

runs:
  using: composite

  steps:
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.java_version }}
        cache: maven

    - name: Run Maven Tests
      if: hashFiles(format('{0}/pom.xml', inputs.app_directory)) != ''
      shell: bash
      working-directory: ${{ inputs.app_directory }}
      run: |
        mvn -B test

    - name: Run Gradle Tests
      if: hashFiles(format('{0}/build.gradle', inputs.app_directory)) != '' || hashFiles(format('{0}/build.gradle.kts', inputs.app_directory)) != ''
      shell: bash
      working-directory: ${{ inputs.app_directory }}
      run: |
        if [ -f gradlew ]; then
          chmod +x gradlew
          ./gradlew test
        else
          gradle test
        fi

    - name: Check Java Build Configuration
      shell: bash
      working-directory: ${{ inputs.app_directory }}
      run: |
        if [ ! -f pom.xml ] && \
           [ ! -f build.gradle ] && \
           [ ! -f build.gradle.kts ]; then
          echo "No Maven or Gradle configuration found."
          exit 1
        fi
