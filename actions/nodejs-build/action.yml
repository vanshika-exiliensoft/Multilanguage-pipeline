
name: Node.js Build
description: Install dependencies and build Node.js application

inputs:
  node_version:
    required: true
  app_directory:
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node_version }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.app_directory }}
      run: npm ci

    - name: Build application
      shell: bash
      working-directory: ${{ inputs.app_directory }}
      run: npm run build --if-present
