
name: Language Detection
description: Detect application language automatically

inputs:
  language:
    description: Application language
    required: false
    default: auto

  app_directory:
    description: Application directory
    required: false
    default: "."

outputs:
  language:
    description: Detected application language
    value: ${{ steps.detect.outputs.language }}

runs:
  using: composite
  steps:
    - name: Detect application language
      id: detect
      shell: bash
      env:
        APP_DIR: ${{ inputs.app_directory }}
        LANGUAGE: ${{ inputs.language }}
      run: |
        set -euo pipefail

        echo "Application directory: $APP_DIR"

        if [[ ! -d "$APP_DIR" ]]; then
          echo "Application directory does not exist: $APP_DIR"
          exit 1
        fi

        cd "$APP_DIR"

        if [[ "$LANGUAGE" != "auto" ]]; then
          DETECTED_LANGUAGE="$LANGUAGE"
        else
          DETECTED_LANGUAGE=""

          [[ -f package.json ]] && DETECTED_LANGUAGE="${DETECTED_LANGUAGE} nodejs"
          [[ -f requirements.txt || -f pyproject.toml || -f setup.py ]] && DETECTED_LANGUAGE="${DETECTED_LANGUAGE} python"
          [[ -f pom.xml || -f build.gradle || -f build.gradle.kts ]] && DETECTED_LANGUAGE="${DETECTED_LANGUAGE} java"
          [[ -f composer.json ]] && DETECTED_LANGUAGE="${DETECTED_LANGUAGE} php"

          DETECTED_LANGUAGE=$(echo "$DETECTED_LANGUAGE" | xargs)

          if [[ -z "$DETECTED_LANGUAGE" ]]; then
            echo "No supported language detected."
            exit 1
          fi

          LANGUAGE_COUNT=$(echo "$DETECTED_LANGUAGE" | wc -w)

          if [[ "$LANGUAGE_COUNT" -gt 1 ]]; then
            echo "Multiple languages detected: $DETECTED_LANGUAGE"
            echo "Please specify the language manually."
            exit 1
          fi
        fi

        echo "Detected language: $DETECTED_LANGUAGE"
        echo "language=$DETECTED_LANGUAGE" >> "$GITHUB_OUTPUT"
