
name: Python Test
description: Run Python application tests

inputs:
  python_version:
    description: Python runtime version
    required: true

  app_directory:
    description: Application directory
    required: false
    default: "."

runs:
  using: composite

  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.app_directory }}
      run: |
        python -m pip install --upgrade pip

        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi

        if [ -f requirements-dev.txt ]; then
          pip install -r requirements-dev.txt
        fi

        if [ -f pyproject.toml ]; then
          pip install -e ".[test]" || pip install -e .
        fi

        pip install pytest

    - name: Run Python Tests
      shell: bash
      working-directory: ${{ inputs.app_directory }}
      run: |
        if [ -d tests ] || [ -f pytest.ini ] || [ -f pyproject.toml ]; then
          python -m pytest -v
        else
          echo "No Python test directory or pytest configuration found."
          exit 1
        fi
