
name: Runtime Version Resolution
description: Resolve runtime version using application input, configuration files, or centralized default

inputs:
  language:
    description: Application language
    required: true

  app_directory:
    description: Application directory
    required: false
    default: "."

  requested_version:
    description: Version explicitly provided by application
    required: false
    default: ""

  default_version:
    description: Centralized default runtime version
    required: true

outputs:
  resolved_version:
    description: Final runtime version
    value: ${{ steps.version.outputs.resolved_version }}

runs:
  using: composite

  steps:
    - name: Resolve application runtime version
      id: version
      shell: bash

      env:
        LANGUAGE: ${{ inputs.language }}
        APP_DIRECTORY: ${{ inputs.app_directory }}
        REQUESTED_VERSION: ${{ inputs.requested_version }}
        DEFAULT_VERSION: ${{ inputs.default_version }}

      run: |
        set -euo pipefail

        echo "Resolving runtime version..."
        echo "Language: $LANGUAGE"

        APP_DIR="$GITHUB_WORKSPACE/$APP_DIRECTORY"

        if [ ! -d "$APP_DIR" ]; then
          echo "Application directory not found: $APP_DIR"
          exit 1
        fi

        RESOLVED_VERSION=""

        # Priority 1: Explicit application input
        if [ -n "$REQUESTED_VERSION" ]; then

          RESOLVED_VERSION="$REQUESTED_VERSION"
          echo "Version source: Application input"

        else

          # Priority 2: Application configuration file
          case "$LANGUAGE" in

            nodejs)
              VERSION_FILE="$APP_DIR/.nvmrc"
              ;;

            python)
              VERSION_FILE="$APP_DIR/.python-version"
              ;;

            java)
              VERSION_FILE="$APP_DIR/.java-version"
              ;;

            php)
              VERSION_FILE="$APP_DIR/.php-version"
              ;;

            *)
              echo "Unsupported language: $LANGUAGE"
              exit 1
              ;;
          esac

          if [ -f "$VERSION_FILE" ]; then

            RESOLVED_VERSION="$(tr -d '[:space:]' < "$VERSION_FILE")"

            if [ -n "$RESOLVED_VERSION" ]; then
              echo "Version source: Application configuration file"
            fi

          fi

          # Priority 3: Centralized default
          if [ -z "$RESOLVED_VERSION" ]; then

            RESOLVED_VERSION="$DEFAULT_VERSION"
            echo "Version source: Centralized default"

          fi

        fi

        if [ -z "$RESOLVED_VERSION" ]; then
          echo "Unable to resolve runtime version"
          exit 1
        fi

        echo "Resolved version: $RESOLVED_VERSION"

        echo "resolved_version=$RESOLVED_VERSION" >> "$GITHUB_OUTPUT"
