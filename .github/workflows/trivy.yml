
name: Trivy Security Scan

on:
  push:
    branches: [develop, main]
    paths:
      - 'frontend-nodejs/**'
      - 'backend-python/**'
      - 'backend-java/**'
      - 'backend-php/**'
      - 'Dockerfile'
      - '**/Dockerfile'

  pull_request:
    branches: [develop, main]
    paths:
      - 'frontend-nodejs/**'
      - 'backend-python/**'
      - 'backend-java/**'
      - 'backend-php/**'
      

  schedule:
    - cron: '0 2 * * 1'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy-scan:
    name: Scan Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          format: table
          exit-code: '0'
          ignore-unfixed: true
