name: Centralized Multi-Language Pipeline

on:
  workflow_call:
    inputs:
      language:
        description: "Application language: auto, nodejs, python, java, php"
        required: false
        type: string
        default: "auto"

      app_directory:
        description: "Application directory"
        required: false
        type: string
        default: "."

      version:
        description: "Optional runtime version override"
        required: false
        type: string
        default: ""

      deploy_to_aws:
        description: "Enable Docker and AWS deployment for Node.js"
        required: false
        type: boolean
        default: false

    outputs:
      detected_language:
        description: Detected application language
        value: ${{ jobs.detect.outputs.language }}

      resolved_version:
        description: Resolved runtime version
        value: ${{ jobs.resolve-version.outputs.version }}

permissions:
  contents: write
  issues: write
  pull-requests: write
  security-events: write

jobs:

  # Detect application language
  detect:
    name: Detect Application Language
    runs-on: ubuntu-latest

    outputs:
      language: ${{ steps.detect-language.outputs.language }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect Language
        id: detect-language
        uses: vanshika-exiliensoft/Multilanguage-pipeline/actions/language-detection@develop
        with:
          language: ${{ inputs.language }}
          app_directory: ${{ inputs.app_directory }}

  # Resolve runtime version
  resolve-version:
    name: Resolve Runtime Version
    needs: detect
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.resolved_version }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve Version
        id: version
        uses: vanshika-exiliensoft/Multilanguage-pipeline/actions/version-resolution@develop
        with:
          language: ${{ needs.detect.outputs.language }}
          app_directory: ${{ inputs.app_directory }}
          requested_version: ${{ inputs.version }}
          default_version: ${{ needs.detect.outputs.language == 'nodejs' && '22' || needs.detect.outputs.language == 'python' && '3.12' || needs.detect.outputs.language == 'java' && '17' || needs.detect.outputs.language == 'php' && '8.3' || '' }}

  # Trivy Security Scan
  trivy-scan:
    name: Trivy Security Scan
    needs: [detect, resolve-version]

    if: >-
      ${{
        needs.detect.result == 'success' &&
        needs.resolve-version.result == 'success'
      }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Application Repository
        uses: actions/checkout@v4

      - name: Run Trivy Security Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.app_directory }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: '1'
          limit-severities-for-sarif: true

      - name: Upload Trivy Results to GitHub Security
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ needs.detect.outputs.language }}

      - name: Upload Trivy Report as Artifact
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-results.sarif
          retention-days: 30

  # Semantic Release
  semantic-release:
    name: Semantic Release
    needs: [detect, resolve-version, trivy-scan]

    if: >-
      ${{
        github.event_name == 'push' &&
        (
          github.ref == 'refs/heads/develop' ||
          github.ref == 'refs/heads/feat-docker-multicloud-deployment'
        ) &&
        needs.detect.result == 'success' &&
        needs.resolve-version.result == 'success' &&
        needs.trivy-scan.result == 'success'
      }}

    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Application Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'

      - name: Install Semantic Release
        run: |
          npm install --no-save --no-package-lock \
            semantic-release@26 \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/github

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  # Node.js Build
  nodejs-build:
    name: Node.js Build
    needs: [detect, resolve-version, trivy-scan, semantic-release]

    if: >-
      ${{
        always() &&
        needs.detect.result == 'success' &&
        needs.resolve-version.result == 'success' &&
        needs.trivy-scan.result == 'success' &&
        needs.detect.outputs.language == 'nodejs' &&
        (
          needs.semantic-release.result == 'success' ||
          needs.semantic-release.result == 'skipped'
        )
      }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Node.js Application
        uses: vanshika-exiliensoft/Multilanguage-pipeline/actions/nodejs-build@develop
        with:
          node_version: ${{ needs.resolve-version.outputs.version }}
          app_directory: ${{ inputs.app_directory }}

  # Node.js Test
  nodejs-test:
    name: Node.js Test
    needs: [detect, resolve-version, nodejs-build]

    if: >-
      ${{
        always() &&
        needs.detect.result == 'success' &&
        needs.resolve-version.result == 'success' &&
        needs.detect.outputs.language == 'nodejs' &&
        needs.nodejs-build.result == 'success'
      }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Test Node.js Application
        uses: vanshika-exiliensoft/Multilanguage-pipeline/actions/nodejs-test@develop
        with:
          node_version: ${{ needs.resolve-version.outputs.version }}
          app_directory: ${{ inputs.app_directory }}

  # Python Build
  python-build:
    name: Python Build
    needs: [detect, resolve-version, trivy-scan, semantic-release]

    if: >-
      ${{
        always() &&
        needs.detect.result == 'success' &&
        needs.resolve-version.result == 'success' &&
        needs.trivy-scan.result == 'success' &&
        needs.detect.outputs.language == 'python' &&
        (
          needs.semantic-release.result == 'success' ||
          needs.semantic-release.result == 'skipped'
        )
      }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Python Application
        uses: vanshika-exiliensoft/Multilanguage-pipeline/actions/python-build@develop
        with:
          python_version: ${{ needs.resolve-version.outputs.version }}
          app_directory: ${{ inputs.app_directory }}

  # Python Test
  python-test:
    name: Python Test
    needs: [detect, resolve-version, python-build]
    if: needs.detect.outputs.language == 'python'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Test Python Application
        uses: vanshika-exiliensoft/Multilanguage-pipeline/actions/python-test@develop
        with:
          python_version: ${{ needs.resolve-version.outputs.version }}
          app_directory: ${{ inputs.app_directory }}

  # Java Build
  java-build:
    name: Java Build
    needs: [detect, resolve-version, trivy-scan, semantic-release]

    if: >-
      ${{
        always() &&
        needs.detect.result == 'success' &&
        needs.resolve-version.result == 'success' &&
        needs.trivy-scan.result == 'success' &&
        needs.detect.outputs.language == 'java' &&
        (
          needs.semantic-release.result == 'success' ||
          needs.semantic-release.result == 'skipped'
        )
      }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Java Application
        uses: vanshika-exiliensoft/Multilanguage-pipeline/actions/java-build@develop
        with:
          java_version: ${{ needs.resolve-version.outputs.version }}
          app_directory: ${{ inputs.app_directory }}

  # Java Test
  java-test:
    name: Java Test
    needs: [detect, resolve-version, java-build]
    if: needs.detect.outputs.language == 'java'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Test Java Application
        uses: vanshika-exiliensoft/Multilanguage-pipeline/actions/java-test@develop
        with:
          java_version: ${{ needs.resolve-version.outputs.version }}
          app_directory: ${{ inputs.app_directory }}

  # PHP Build
  php-build:
    name: PHP Build
    needs: [detect, resolve-version, trivy-scan, semantic-release]

    if: >-
      ${{
        always() &&
        needs.detect.result == 'success' &&
        needs.resolve-version.result == 'success' &&
        needs.trivy-scan.result == 'success' &&
        needs.detect.outputs.language == 'php' &&
        (
          needs.semantic-release.result == 'success' ||
          needs.semantic-release.result == 'skipped'
        )
      }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build PHP Application
        uses: vanshika-exiliensoft/Multilanguage-pipeline/actions/php-build@develop
        with:
          php_version: ${{ needs.resolve-version.outputs.version }}
          app_directory: ${{ inputs.app_directory }}

  # PHP Test
  php-test:
    name: PHP Test
    needs: [detect, resolve-version, php-build]
    if: needs.detect.outputs.language == 'php'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Test PHP Application
        uses: vanshika-exiliensoft/Multilanguage-pipeline/actions/php-test@develop
        with:
          php_version: ${{ needs.resolve-version.outputs.version }}
          app_directory: ${{ inputs.app_directory }}


  # Docker Build, Image Scan, ECR Push and ECS Deployment
  docker-aws-deploy:
    name: Docker Build and AWS ECS Deployment
    needs: [detect, trivy-scan, nodejs-test]

    if: >-
        ${{
          always() &&
          github.event_name == 'push' &&
          inputs.deploy_to_aws == true &&
          needs.detect.result == 'success' &&
          needs.trivy-scan.result == 'success' &&
          needs.nodejs-test.result == 'success' &&
          needs.detect.outputs.language == 'nodejs'
        }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ap-south-1
      ECR_REPOSITORY: multilanguage-pipeline
      ECS_CLUSTER: multilanguage-cluster
      ECS_SERVICE: multilanguage-nodejs-service
      IMAGE_TAG: sha-${{ github.sha }}-${{ github.run_number }}-${{ github.run_attempt }}
      APP_DIRECTORY: ${{ inputs.app_directory }}

    steps:
      - name: Checkout Application Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t "$ECR_REPOSITORY:$IMAGE_TAG" \
            "$APP_DIRECTORY"

      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: multilanguage-pipeline:sha-${{ github.sha }}-${{ github.run_number }}-${{ github.run_attempt }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Configure AWS OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::864899835094:role/MultilanguageGitHubActionsRole
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker Image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag "$ECR_REPOSITORY:$IMAGE_TAG" \
            "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Render ECS Task Definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ inputs.app_directory }}/task-definition.json
          container-name: nodejs-app
          image: ${{ steps.login-ecr.outputs.registry }}/multilanguage-pipeline:sha-${{ github.sha }}-${{ github.run_number }}-${{ github.run_attempt }}

      - name: Deploy to ECS Fargate
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          cluster: multilanguage-cluster
          service: multilanguage-nodejs-service
          wait-for-service-stability: true

