
name: Centralized Multi-Language Pipeline

on:
  workflow_call:
    inputs:
      language:
        description: "Application language: auto, nodejs, python, java, php"
        required: false
        type: string
        default: "auto"

      app_directory:
        description: "Application directory"
        required: false
        type: string
        default: "."

      node_version:
        description: "Node.js version"
        required: false
        type: string
        default: "22"

      python_version:
        description: "Python version"
        required: false
        type: string
        default: "3.12"

      java_version:
        description: "Java version"
        required: false
        type: string
        default: "17"

      php_version:
        description: "PHP version"
        required: false
        type: string
        default: "8.3"

    outputs:
      detected_language:
        description: "Detected application language"
        value: ${{ jobs.detect.outputs.language }}

permissions:
  contents: read

jobs:

#Detect language

  detect:
    name: Detect Application Language
    runs-on: ubuntu-latest

    outputs:
      language: ${{ steps.detect-language.outputs.language }}

    steps:
      - name: Checkout Application Repository
        uses: actions/checkout@v4

      - name: Detect application language
        id: detect-language
        uses: vanshika-exiliensoft/Multilanguage-pipeline/actions/language-detection@develop
        with:
          language: ${{ inputs.language }}
          app_directory: ${{ inputs.app_directory }}

# Nodejs build and test

  nodejs-test:
    name: Node.js Build and Test
    needs: detect
    if: needs.detect.outputs.language == 'nodejs'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Application Repository
        uses: actions/checkout@v4

      - name: Run Node.js Tests
        uses: vanshika-exiliensoft/Multilanguage-pipeline/actions/nodejs-test@develop
        with:
          node_version: ${{ inputs.node_version }}
          app_directory: ${{ inputs.app_directory }}

# Python build and test

  python-test:
    name: Python Build and Test
    needs: detect
    if: needs.detect.outputs.language == 'python'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Application Repository
        uses: actions/checkout@v4

      - name: Run Python Tests
        uses: vanshika-exiliensoft/Multilanguage-pipeline/actions/python-test@develop
        with:
          python_version: ${{ inputs.python_version }}
          app_directory: ${{ inputs.app_directory }}

# Java build and test

  java-test:
    name: Java Build and Test
    needs: detect
    if: needs.detect.outputs.language == 'java'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Application Repository
        uses: actions/checkout@v4

      - name: Run Java Tests
        uses: vanshika-exiliensoft/Multilanguage-pipeline/actions/java-test@develop
        with:
          java_version: ${{ inputs.java_version }}
          app_directory: ${{ inputs.app_directory }}

# Php build and test

  php-test:
    name: PHP Build and Test
    needs: detect
    if: needs.detect.outputs.language == 'php'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Application Repository
        uses: actions/checkout@v4

      - name: Run PHP Tests
        uses: vanshika-exiliensoft/Multilanguage-pipeline/actions/php-test@develop
        with:
          php_version: ${{ inputs.php_version }}
          app_directory: ${{ inputs.app_directory }}
