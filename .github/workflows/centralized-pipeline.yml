name: Centralized Multi-Language Pipeline

on:
  workflow_call:
    inputs:
      language:
        description: "Application programming language"
        required: false
        type: string
        default: "auto"

      app_directory:
        description: "Application source directory"
        required: false
        type: string
        default: "."

      node_version:
        description: "Node.js version"
        required: false
        type: string
        default: "22"

      python_version:
        description: "Python version"
        required: false
        type: string
        default: "3.12"

      java_version:
        description: "Java version"
        required: false
        type: string
        default: "17"

      php_version:
        description: "PHP version"
        required: false
        type: string
        default: "8.3"

    outputs:
      detected_language:
        description: "Detected application language"
        value: ${{ jobs.detect.outputs.language }}

permissions:
  contents: read
  

jobs:
  detect:
    name: Detect Application Language
    runs-on: ubuntu-latest

    outputs:
      language: ${{ steps.detect.outputs.language }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect language
        id: detect
        uses: vanshika-exiliensoft/Multilanguage-pipeline/actions/language-detection@main
        with:
          app-directory: ${{ inputs.app-directory }}
          language: ${{ inputs.language }}

  test:
    name: Build and test
    runs-on: ubuntu-latest
    needs: detect

    if: needs.detect.outputs.language != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and test
        uses: vanshika-exiliensoft/Multilanguage-pipeline/actions/language-detection@main
        with:
          version: ${{ inputs.version }}
          app-directory: ${{ inputs.app-directory }}

      - name: Run Python Tests
        if: needs.detect.outputs.language == 'python'
        uses: vanshika-exiliensoft/Multilanguage-pipeline/actions/python-test@main
        with:
          version: ${{ inputs.version }}
          app_directory: ${{ inputs.app-directory }}

      - name: Run Java Tests
        if: needs.detect.outputs.language == 'java'
        uses: vanshika-exiliensoft/Multilanguage-pipeline/actions/java-test@main
        with:
          version: ${{ inputs.version }}
          app_directory: ${{ inputs.app-directory }}

      - name: Pipeline Completed
        run: |
          echo "Multi-language Pipeline Successful"
          echo "Language: ${{ needs.detect.outputs.language }}"
          

