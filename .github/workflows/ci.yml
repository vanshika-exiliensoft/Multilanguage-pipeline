
name: Multi-Language CI + Trivy Security Scan

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

# Cancel older runs for the same branch 
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:

# Detect changes
  changes:
    name: Detect Changed Languages
    runs-on: ubuntu-latest

    outputs:
      node: ${{ steps.filter.outputs.node }}
      python: ${{ steps.filter.outputs.python }}
      java: ${{ steps.filter.outputs.java }}
      php: ${{ steps.filter.outputs.php }}
      security: ${{ steps.filter.outputs.security }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changed Files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.event.before }}
          filters: |
            node:
              - 'frontend-nodejs/**'
              - '.github/workflows/**'

            python:
              - 'backend-python/**'
              - '.github/workflows/**'

            java:
              - 'backend-java/**'
              - '.github/workflows/**'

            php:
              - 'backend-php/**'
              - '.github/workflows/**'

            security:
              - 'frontend-nodejs/**'
              - 'backend-python/**'
              - 'backend-java/**'
              - 'backend-php/**'
              - '.github/workflows/**'
              - '.trivyignore'

# Node.js ci
  nodejs:
    name: Node.js CI
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-nodejs

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-nodejs/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test --if-present

      - name: Build Application
        run: npm run build --if-present

# Python ci
  python:
    name: Python CI
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend-python

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend-python/requirements.txt

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Tests
        run: |
          if [ -d tests ]; then
            pip install pytest
            pytest
          else
            python -m compileall .
          fi

# Java ci
  java:
    name: Java CI
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend-java

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and Test
        run: mvn -B verify

# Php ci
  php:
    name: PHP CI
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend-php

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run Tests
        run: |
          if [ -f vendor/bin/phpunit ]; then
            vendor/bin/phpunit
          else
            find . -path ./vendor -prune -o \
              -name '*.php' -type f \
              -exec php -l {} \;
          fi

# Trivy Scan
  trivy:
    name: Trivy Security Scan
    needs: changes
    if: needs.changes.outputs.security == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Trivy Filesystem Security Scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
