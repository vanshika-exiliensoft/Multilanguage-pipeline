
name: Node.js CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend-nodejs/**'
      - '.github/workflows/nodejs.yml'

  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend-nodejs/**'
      - '.github/workflows/nodejs.yml'

  workflow_dispatch:

jobs:
  nodejs-build:
    name: Node.js Build and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-nodejs

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-nodejs/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint --if-present

      - name: Run Tests
        run: npm test --if-present

      - name: Build Application
        run: npm run build --if-present
